[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pallet-audit"
version = "0.1.0"
description = "Fail-safe pallet pose and load compliance assessment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.8", "ultralytics>=8.3,<9"]
anomaly = ["anomalib>=2,<3"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
pallet-audit = "pallet_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
